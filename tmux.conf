# Prefix / reload
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Splits
unbind '"'
unbind %
bind | split-window -h
bind - split-window -v

# Mouse mode
set -g mouse on

# Responsiveness
set -sg escape-time 0
set -g focus-events on

# Terminal / colors / clipboard
set -g default-terminal "tmux-256color"
set -as terminal-features ',*:RGB'
set -as terminal-features ',*:clipboard'
set -as terminal-features ',*:extkeys'

set -g set-clipboard on
set -g allow-passthrough on

# Status bar layout
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style 'bg=default fg=white'

# No left status/session name
set -g status-left-length 0
set -g status-left ''

# Right status: time
set -g status-right-length 80
set -g status-right '#[fg=#33658A]#[bg=#33658A,fg=white,bold] %H:%M:%S #[bg=default,fg=#33658A]'

# Window status
setw -g window-status-separator ''

setw -g window-status-style 'bg=default fg=white'
setw -g window-status-format '#[fg=#DA627D]#[bg=#DA627D,fg=white] #I:#W#{?window_flags, #F,} #[bg=default,fg=#DA627D]'

setw -g window-status-current-style 'bg=default fg=white bold'
setw -g window-status-current-format '#[fg=#FCA17D]#[bg=#FCA17D,fg=black,bold] #I:#W#{?window_flags, #F,} #[bg=default,fg=#FCA17D]'

# Pane borders
set -g pane-border-style fg="#8AC8FF"
set -g pane-active-border-style fg="#FC305C"

# Message / command prompt style
set -g message-style 'fg=black bg=#C9A3FF bold'
set -g message-command-style 'fg=black bg=#C9A3FF bold'

# Pane navigation
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Pane resizing
bind -r M-h resize-pane -L
bind -r M-l resize-pane -R
bind -r M-k resize-pane -U
bind -r M-j resize-pane -D
